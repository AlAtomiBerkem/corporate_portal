version: '3.8'

services:
  server:
    image: corporate-portal-server:latest
    ports:
      - '5000:5000'
    env_file:
      - ./server/.env
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  client:
    image: corporate-portal-client:latest
    ports:
      - '3000:80'
    depends_on:
      - server
    networks:
      - app-network
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=site_database
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

volumes:
  mongo-data:
    driver: local

networks:
  app-network:
    driver: bridge 