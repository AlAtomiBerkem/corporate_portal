services:
  server:
    build: ./server
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/site_database
    depends_on:
      - mongo
    networks:
      - app-network
    restart: unless-stopped

  client:
    build: ./client
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - app-network
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network
    restart: unless-stopped
    # environment:
    #   - MONGO_INITDB_ROOT_USERNAME=login
    #   - MONGO_INITDB_ROOT_PASSWORD=your_strong_password

volumes:
  mongo-data:

networks:
  app-network:
    driver: bridge